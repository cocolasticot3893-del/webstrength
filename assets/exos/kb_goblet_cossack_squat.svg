<svg viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KB_GOBLET_COSSACK_SQUAT : Cossack squat frontal avec kettlebell en goblet">
  <style>
    .kgc-leftleg {
      transform-origin: 62px 184px;
      animation: KB_GOBLET_COSSACK_SQUAT_left calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .kgc-torso {
      transform-origin: 112px 106px;
      animation: KB_GOBLET_COSSACK_SQUAT_torso calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .kgc-rthigh {
      transform-origin: 132px 106px;
      animation: KB_GOBLET_COSSACK_SQUAT_rthigh calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .kgc-rshin {
      transform-origin: 146px 140px;
      animation: KB_GOBLET_COSSACK_SQUAT_rshin calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .kgc-cue {
      animation: KB_GOBLET_COSSACK_SQUAT_cue calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    @keyframes KB_GOBLET_COSSACK_SQUAT_left {
      0%, 100% { transform: rotate(0deg); }
      45%, 60% { transform: rotate(28deg); }
    }
    @keyframes KB_GOBLET_COSSACK_SQUAT_torso {
      0%, 100% { transform: rotate(0deg); }
      45%, 60% { transform: rotate(-28deg); }
    }
    @keyframes KB_GOBLET_COSSACK_SQUAT_rthigh {
      0%, 100% { transform: rotate(0deg); }
      45%, 60% { transform: rotate(-62deg); }
    }
    @keyframes KB_GOBLET_COSSACK_SQUAT_rshin {
      0%, 100% { transform: rotate(0deg); }
      45%, 60% { transform: rotate(116deg); }
    }
    @keyframes KB_GOBLET_COSSACK_SQUAT_cue {
      0%, 25%, 80%, 100% { opacity: 0.25; }
      45%, 60% { opacity: 1; }
    }
  </style>

  <rect width="240" height="220" rx="14" fill="#0d1117"/>
  <line x1="20" y1="186" x2="220" y2="186" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

  <!-- Repères appuis larges au sol -->
  <path d="M56 184 L68 176" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M160 184 L178 184" stroke="#8b949e" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Jambe gauche tendue pivotant depuis talon (62, 184) -> transfert bassin -->
  <g class="kgc-leftleg">
    <line x1="62" y1="184" x2="112" y2="106" stroke="#e6edf3" stroke-width="5.8" stroke-linecap="round"/>
    <!-- Bassin + buste contre-roté pour rester vertical -->
    <g class="kgc-torso">
      <!-- Ligne de bassin frontal -->
      <line x1="112" y1="106" x2="132" y2="106" stroke="#38bdf8" stroke-width="5.5" stroke-linecap="round"/>
      <!-- Buste droit -->
      <line x1="122" y1="106" x2="122" y2="66" stroke="#10b981" stroke-width="6.4" stroke-linecap="round"/>
      <!-- Tête -->
      <circle cx="122" cy="52" r="8" fill="#e6edf3"/>
      <!-- Bras + Kettlebell en goblet devant la poitrine -->
      <polyline points="113,70 112,86 122,82" fill="none" stroke="#e6edf3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="131,70 132,86 122,82" fill="none" stroke="#e6edf3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M117 77 C117 72, 127 72, 127 77" fill="none" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="122" cy="83" r="6" fill="#f59e0b"/>

      <!-- Jambe droite fléchie en transfert latéral -->
      <g class="kgc-rthigh">
        <line x1="132" y1="106" x2="146" y2="140" stroke="#e6edf3" stroke-width="6" stroke-linecap="round"/>
        <g class="kgc-rshin">
          <line x1="146" y1="140" x2="162" y2="184" stroke="#8b949e" stroke-width="5.6" stroke-linecap="round"/>
        </g>
        <circle cx="146" cy="140" r="3" fill="#e6edf3"/>
      </g>
      <circle cx="112" cy="106" r="3" fill="#10b981"/>
      <circle cx="132" cy="106" r="3" fill="#10b981"/>
    </g>
  </g>
  <circle cx="62" cy="184" r="2.8" fill="#38bdf8"/>

  <!-- Flèche transfert latéral bas -->
  <g class="kgc-cue">
    <path d="M118 122 L152 142 M145 143 L153 143 L150 136" fill="none" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="136" text-anchor="middle" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="8" font-weight="600">JAMBE TENDUE</text>
  </g>

  <text x="16" y="24" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600">KB · GOBLET COSSACK</text>
  <text x="224" y="24" text-anchor="end" fill="#10b981" font-family="system-ui,sans-serif" font-size="9">MOBILITÉ HANCHE</text>
  <text x="120" y="206" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="8.5">TRANSFERT LATÉRAL BAS · BUSTE DROIT</text>
</svg>
