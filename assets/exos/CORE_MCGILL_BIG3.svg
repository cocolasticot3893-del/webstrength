<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="Trilogie de McGill Big 3 : Curl-up, Side-Bridge, Bird-Dog">
  <style>
    .cmg-anim {
      --base-dur: 4.5s;
      animation-duration: calc(var(--base-dur, 4.5s) / var(--anim-speed, 1));
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-play-state: var(--anim-state, running);
    }
    .cmg-curl { transform-origin: 108px 63px; animation-name: cmg-curl-lift; }
    .cmg-side { transform-origin: 170px 128px; animation-name: cmg-side-hold; }
    .cmg-arm { transform-origin: 138px 164px; animation-name: cmg-bd-arm; }
    .cmg-leg { transform-origin: 96px 164px; animation-name: cmg-bd-leg; }
    .cmg-c1 { animation-name: cmg-hi1; }
    .cmg-c2 { animation-name: cmg-hi2; }
    .cmg-c3 { animation-name: cmg-hi3; }
    @keyframes cmg-curl-lift {
      0%, 35%, 100% { transform: rotate(0deg); }
      14%, 24% { transform: rotate(8deg); }
    }
    @keyframes cmg-side-hold {
      0%, 30%, 70%, 100% { transform: translateY(2px); }
      45%, 58% { transform: translateY(-2px); }
    }
    @keyframes cmg-bd-arm {
      0%, 60%, 100% { transform: rotate(82deg); }
      76%, 88% { transform: rotate(0deg); }
    }
    @keyframes cmg-bd-leg {
      0%, 60%, 100% { transform: rotate(-84deg); }
      76%, 88% { transform: rotate(0deg); }
    }
    @keyframes cmg-hi1 { 0%, 35%, 100% { stroke: #1e293b; } 14%, 24% { stroke: #38bdf8; } }
    @keyframes cmg-hi2 { 0%, 30%, 70%, 100% { stroke: #1e293b; } 45%, 58% { stroke: #38bdf8; } }
    @keyframes cmg-hi3 { 0%, 60%, 100% { stroke: #1e293b; } 76%, 88% { stroke: #38bdf8; } }
  </style>
  <rect width="240" height="220" rx="12" fill="#0d1117" />
  <text x="120" y="18" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="9" font-weight="600" letter-spacing="0.8">MCGILL BIG 3 • GAINAGE 360°</text>

  <!-- 1. Curl-Up (haut) -->
  <rect x="14" y="25" width="212" height="49" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.2" class="cmg-anim cmg-c1" />
  <text x="22" y="37" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="7.5" font-weight="700">1. CURL-UP</text>
  <line x1="48" y1="68" x2="196" y2="68" stroke="#334155" stroke-width="1.5" />
  <path d="M108 64 L142 64 L162 46 L174 66" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <g class="cmg-anim cmg-curl">
    <line x1="78" y1="63" x2="108" y2="63" stroke="#10b981" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="67" cy="59" r="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.6" />
  </g>
  <circle cx="108" cy="64" r="2.8" fill="#22d3ee" />
  <circle cx="162" cy="46" r="2.8" fill="#22d3ee" />

  <!-- 2. Side-Bridge (milieu) -->
  <rect x="14" y="81" width="212" height="53" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.2" class="cmg-anim cmg-c2" />
  <text x="22" y="93" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="7.5" font-weight="700">2. SIDE BRIDGE</text>
  <line x1="48" y1="128" x2="196" y2="128" stroke="#334155" stroke-width="1.5" />
  <g class="cmg-anim cmg-side">
    <path d="M74 108 L74 126 L88 126" fill="none" stroke="#94a3b8" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="64" cy="100" r="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.6" />
    <line x1="74" y1="106" x2="124" y2="117" stroke="#10b981" stroke-width="4.5" stroke-linecap="round" />
    <line x1="124" y1="117" x2="170" y2="126" stroke="#cbd5e1" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="74" cy="106" r="2.8" fill="#22d3ee" />
    <circle cx="124" cy="117" r="2.8" fill="#22d3ee" />
  </g>

  <!-- 3. Bird-Dog (bas) -->
  <rect x="14" y="141" width="212" height="57" rx="6" fill="#111827" stroke="#1e293b" stroke-width="1.2" class="cmg-anim cmg-c3" />
  <text x="22" y="153" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="7.5" font-weight="700">3. BIRD-DOG</text>
  <line x1="42" y1="192" x2="202" y2="192" stroke="#334155" stroke-width="1.5" />
  <!-- Appuis stables -->
  <line x1="138" y1="164" x2="138" y2="190" stroke="#64748b" stroke-width="3.8" stroke-linecap="round" />
  <path d="M96 164 L96 190 L80 190" fill="none" stroke="#64748b" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Colonne verrouillée horizontale -->
  <line x1="96" y1="164" x2="138" y2="164" stroke="#10b981" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="149" cy="158" r="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.6" />
  <!-- Bras & jambe opposés en extension -->
  <line x1="138" y1="164" x2="176" y2="164" stroke="#e2e8f0" stroke-width="3.8" stroke-linecap="round" class="cmg-anim cmg-arm" />
  <line x1="96" y1="164" x2="56" y2="164" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" class="cmg-anim cmg-leg" />
  <circle cx="96" cy="164" r="3" fill="#22d3ee" />
  <circle cx="138" cy="164" r="3" fill="#22d3ee" />

  <text x="120" y="212" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="8.5" font-weight="600">Colonne lombaire neutre • Zéro flexion discale</text>
</svg>
