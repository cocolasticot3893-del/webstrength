<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="Suspension scapulaire pronation isométrique bras tendus">
  <style>
    .pusi_torso {
      --base-dur: 3.0s;
      animation: pusi_depress calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .pusi_halo {
      --base-dur: 3.0s;
      animation: pusi_iso_ring calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    @keyframes pusi_depress {
      0%, 100% { transform: translateY(8px); }
      35%, 70% { transform: translateY(-3px); }
    }
    @keyframes pusi_iso_ring {
      0%, 100% { opacity: 0.2; }
      35%, 70% { opacity: 1; }
    }
  </style>

  <rect width="240" height="220" rx="14" fill="#0d1117"/>

  <!-- Barre haute et sol -->
  <line x1="36" y1="34" x2="204" y2="34" stroke="#8b949e" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="20" y1="188" x2="220" y2="188" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>

  <!-- Mains pronation et bras 100% tendus verrouillés -->
  <rect x="88" y="30" width="10" height="8" rx="2.5" fill="#e6edf3"/>
  <rect x="142" y="30" width="10" height="8" rx="2.5" fill="#e6edf3"/>
  <line x1="93" y1="36" x2="98" y2="92" stroke="#e6edf3" stroke-width="5" stroke-linecap="round"/>
  <line x1="147" y1="36" x2="142" y2="92" stroke="#e6edf3" stroke-width="5" stroke-linecap="round"/>

  <!-- Repères coudes verrouillés 180° -->
  <circle cx="95.5" cy="64" r="3" fill="#38bdf8"/>
  <circle cx="144.5" cy="64" r="3" fill="#38bdf8"/>
  <text x="64" y="67" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="7.5" font-weight="600">180°</text>

  <!-- Corps : élévation/abaissement scapulaire court sans plier les coudes -->
  <g class="pusi_torso">
    <circle cx="120" cy="70" r="8.2" fill="#e6edf3"/>
    <!-- Épaules -->
    <line x1="98" y1="90" x2="142" y2="90" stroke="#8b949e" stroke-width="5" stroke-linecap="round"/>

    <!-- Halo isométrique sur les omoplates -->
    <g class="pusi_halo">
      <ellipse cx="110" cy="100" rx="9" ry="12" fill="#10b981" fill-opacity="0.22" stroke="#10b981" stroke-width="1.6"/>
      <ellipse cx="130" cy="100" rx="9" ry="12" fill="#10b981" fill-opacity="0.22" stroke="#10b981" stroke-width="1.6"/>
      <!-- Flèches rétraction/abaissement scapulaire -->
      <path d="M107 95 L112 103 M133 95 L128 103" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Tronc et jambes -->
    <path d="M104,90 L136,90 L129,134 L111,134 Z" fill="#1f2937" stroke="#30363d" stroke-width="1.8"/>
    <line x1="115" y1="135" x2="115" y2="172" stroke="#8b949e" stroke-width="5" stroke-linecap="round"/>
    <line x1="125" y1="135" x2="125" y2="172" stroke="#8b949e" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Flèches latérales abaissement épaules -->
  <path d="M174 86 L174 102 M170 97 L174 103 L178 97" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="174" y="114" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="7.5" font-weight="600">SCAP ISO</text>

  <text x="16" y="21" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9" font-weight="600">UPPER · SCAPULA</text>
  <text x="224" y="21" text-anchor="end" fill="#10b981" font-family="system-ui,sans-serif" font-size="8.5" font-weight="600">COUDES TENDUS</text>
  <text x="120" y="206" text-anchor="middle" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600">SUSPENSION SCAPULAIRE · ISO HAUT</text>
</svg>
