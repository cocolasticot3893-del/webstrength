<svg viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pogo jump unilatéral : rebonds élastiques sur une jambe sans effondrement du talon">
  <style>
    .plyo_aps_body {
      --base-dur: 0.9s;
      transform-origin: 120px 184px;
      animation: plyo_aps_hop calc(var(--base-dur, 1.6s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .plyo_aps_ring {
      --base-dur: 0.9s;
      animation: plyo_aps_wave calc(var(--base-dur, 1.6s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    @keyframes plyo_aps_hop {
      0%, 100% { transform: translateY(2px); }
      45%, 55% { transform: translateY(-20px); }
    }
    @keyframes plyo_aps_wave {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.25; transform: scale(1.2); }
    }
  </style>

  <rect width="240" height="220" rx="14" fill="#0d1117"/>
  <line x1="20" y1="186" x2="220" y2="186" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

  <!-- Repère talon décollé (pas d'effondrement) -->
  <line x1="64" y1="179" x2="108" y2="179" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="3 3"/>
  <text x="60" y="182" text-anchor="end" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="8">TALON HAUT</text>

  <!-- Onde contact élastique -->
  <circle class="plyo_aps_ring" cx="128" cy="186" r="10" fill="none" stroke="#10b981" stroke-width="1.8" stroke-dasharray="4 3"/>

  <!-- Vecteur rebond unilatéral -->
  <line x1="168" y1="168" x2="168" y2="112" stroke="#10b981" stroke-width="2.2" stroke-linecap="round"/>
  <polyline points="162,122 168,110 174,122" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Athlète unilatéral (profil) -->
  <g class="plyo_aps_body">
    <!-- Jambe libre fléchie maintenue haute -->
    <polyline points="116,106 138,118 134,142" fill="none" stroke="#30363d" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="138" cy="118" r="2.8" fill="#8b949e"/>
    <!-- Jambe d'appui raide, avant-pied seul au contact -->
    <polyline points="129,184 118,178 122,144 116,106" fill="none" stroke="#e6edf3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="118" cy="178" r="3" fill="#f59e0b"/>
    <circle cx="122" cy="144" r="3" fill="#e6edf3"/>
    <!-- Tronc vertical gainé -->
    <line x1="116" y1="106" x2="118" y2="66" stroke="#10b981" stroke-width="6.8" stroke-linecap="round"/>
    <polyline points="118,70 134,84 128,96" fill="none" stroke="#38bdf8" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="119" cy="51" r="8.2" fill="#e6edf3"/>
    <circle cx="116" cy="106" r="3.4" fill="#38bdf8"/>
  </g>

  <text x="16" y="24" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600">PLYO · POGO UNILAT.</text>
  <text x="224" y="24" text-anchor="end" fill="#10b981" font-family="system-ui,sans-serif" font-size="9">1 JAMBE · RAIDEUR</text>
</svg>
