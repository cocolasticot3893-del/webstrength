<svg viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KBOX_SINGLE_LEG_RDL : soulevé de terre roumain unilatéral sur kBox">
  <style>
    .ksr-fly {
      transform-origin: 118px 181px;
      animation: KBOX_SINGLE_LEG_RDL_fly calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .ksr-hinge {
      transform-origin: 118px 108px;
      animation: KBOX_SINGLE_LEG_RDL_hinge calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .ksr-arm {
      transform-origin: 118px 66px;
      animation: KBOX_SINGLE_LEG_RDL_arm calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .ksr-strap {
      transform-origin: 118px 174px;
      animation: KBOX_SINGLE_LEG_RDL_strap calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .ksr-cue {
      animation: KBOX_SINGLE_LEG_RDL_cue calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    @keyframes KBOX_SINGLE_LEG_RDL_fly {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(360deg); }
    }
    @keyframes KBOX_SINGLE_LEG_RDL_hinge {
      0%, 100% { transform: rotate(6deg); }
      48%, 56% { transform: rotate(74deg); }
    }
    @keyframes KBOX_SINGLE_LEG_RDL_arm {
      0%, 100% { transform: rotate(-6deg); }
      48%, 56% { transform: rotate(-74deg); }
    }
    @keyframes KBOX_SINGLE_LEG_RDL_strap {
      0%, 100% { transform: scaleY(1); }
      48%, 56% { transform: scaleY(0.56); }
    }
    @keyframes KBOX_SINGLE_LEG_RDL_cue {
      0%, 20%, 85%, 100% { opacity: 0.2; }
      45%, 60% { opacity: 1; }
    }
  </style>

  <rect width="240" height="220" rx="14" fill="#0d1117"/>
  <line x1="20" y1="190" x2="220" y2="190" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

  <!-- Plateforme kBox -->
  <rect x="64" y="174" width="108" height="16" rx="4" fill="#1f2937" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="118" cy="181" r="8" fill="#0d1117" stroke="#8b949e" stroke-width="1.4"/>
  <g class="ksr-fly">
    <line x1="118" y1="174" x2="118" y2="188" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="111" y1="181" x2="125" y2="181" stroke="#8b949e" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- Sangle de traction -->
  <line class="ksr-strap" x1="118" y1="174" x2="118" y2="108" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 3" stroke-linecap="round"/>

  <!-- Jambe d'appui quasi-tendue (genou déverrouillé) -->
  <path d="M114 172 L134 172" stroke="#8b949e" stroke-width="5" stroke-linecap="round"/>
  <line x1="118" y1="172" x2="122" y2="140" stroke="#8b949e" stroke-width="5.8" stroke-linecap="round"/>
  <line x1="122" y1="140" x2="118" y2="108" stroke="#e6edf3" stroke-width="6.2" stroke-linecap="round"/>
  <circle cx="118" cy="172" r="2.8" fill="#38bdf8"/>
  <circle cx="122" cy="140" r="3" fill="#e6edf3"/>

  <!-- Charnière buste + jambe libre alignée -->
  <g class="ksr-hinge">
    <!-- Jambe libre tendue vers l'arrière dans le prolongement exact du buste -->
    <line x1="118" y1="108" x2="118" y2="162" stroke="#8b949e" stroke-width="5" stroke-linecap="round"/>
    <line x1="118" y1="162" x2="111" y2="164" stroke="#8b949e" stroke-width="4" stroke-linecap="round"/>
    <!-- Buste neutre -->
    <line x1="118" y1="108" x2="118" y2="62" stroke="#10b981" stroke-width="6.4" stroke-linecap="round"/>
    <!-- Tête alignée -->
    <circle cx="119" cy="48" r="8" fill="#e6edf3"/>
    <!-- Bras + poignée kBox restant vertical -->
    <g class="ksr-arm">
      <line x1="118" y1="66" x2="118" y2="104" stroke="#e6edf3" stroke-width="4.4" stroke-linecap="round"/>
      <rect x="112" y="102" width="12" height="5" rx="2" fill="#f59e0b"/>
    </g>
    <circle cx="118" cy="66" r="2.8" fill="#38bdf8"/>
  </g>
  <circle cx="118" cy="108" r="3.5" fill="#10b981"/>

  <!-- Repère alignement buste-jambe libre -->
  <g class="ksr-cue">
    <line x1="56" y1="92" x2="178" y2="108" stroke="#10b981" stroke-width="1.3" stroke-dasharray="3 3"/>
    <text x="120" y="206" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="9" font-weight="600">ALIGNEMENT BUSTE · JAMBE LIBRE</text>
  </g>

  <text x="16" y="24" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600">kBox · SINGLE-LEG RDL</text>
  <text x="224" y="24" text-anchor="end" fill="#10b981" font-family="system-ui,sans-serif" font-size="9">ISCHIOS UNILAT.</text>
</svg>
