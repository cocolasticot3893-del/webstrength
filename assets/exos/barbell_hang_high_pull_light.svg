<svg viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hang high pull barre légère : poussée de hanche et tirage haut rapide">
  <style>
    .bb_hhp_torso {
      --base-dur: 1.3s;
      transform-origin: 112px 118px;
      animation: bb_hhp_snap calc(var(--base-dur, 1.6s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .bb_hhp_bar {
      --base-dur: 1.3s;
      transform-origin: 130px 132px;
      animation: bb_hhp_lift calc(var(--base-dur, 1.6s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .bb_hhp_arm {
      --base-dur: 1.3s;
      transform-origin: 120px 72px;
      animation: bb_hhp_elbow calc(var(--base-dur, 1.6s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .bb_hhp_cue {
      --base-dur: 1.3s;
      animation: bb_hhp_pulse calc(var(--base-dur, 1.6s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    @keyframes bb_hhp_snap {
      0%, 100% { transform: rotate(28deg); }
      55%, 70% { transform: rotate(-4deg); }
    }
    @keyframes bb_hhp_lift {
      0%, 100% { transform: translate(6px, 0px); }
      55%, 70% { transform: translate(-2px, -54px); }
    }
    @keyframes bb_hhp_elbow {
      0%, 100% { transform: rotate(10deg); }
      55%, 70% { transform: rotate(-75deg); }
    }
    @keyframes bb_hhp_pulse {
      0%, 25%, 90%, 100% { opacity: 0.15; }
      52%, 72% { opacity: 1; }
    }
  </style>

  <rect width="240" height="220" rx="14" fill="#0d1117"/>
  <line x1="20" y1="186" x2="220" y2="186" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

  <!-- Repère hauteur hang au-dessus des genoux -->
  <line x1="56" y1="132" x2="104" y2="132" stroke="#f59e0b" stroke-width="1.3" stroke-dasharray="3 3"/>
  <text x="52" y="135" text-anchor="end" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="8">HANG</text>

  <!-- Flèche vitesse verticale barre -->
  <g class="bb_hhp_cue">
    <line x1="176" y1="138" x2="176" y2="66" stroke="#10b981" stroke-width="2.6" stroke-linecap="round"/>
    <polyline points="169,77 176,64 183,77" fill="none" stroke="#10b981" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="188" y1="122" x2="188" y2="82" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="5 3" stroke-linecap="round"/>
  </g>

  <!-- Jambes (genoux légèrement fléchis -> extension) -->
  <polyline points="118,184 110,184 120,148 112,118" fill="none" stroke="#8b949e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="120" cy="148" r="3" fill="#e6edf3"/>

  <!-- Tronc + bras + barre -->
  <g class="bb_hhp_torso">
    <line x1="112" y1="118" x2="120" y2="72" stroke="#10b981" stroke-width="6.8" stroke-linecap="round"/>
    <circle cx="122" cy="56" r="8.2" fill="#e6edf3"/>
    <g class="bb_hhp_arm">
      <polyline points="120,72 132,98 130,132" fill="none" stroke="#e6edf3" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <circle cx="120" cy="72" r="3" fill="#38bdf8"/>
  </g>
  <circle cx="112" cy="118" r="3.4" fill="#38bdf8"/>

  <!-- Barre légère + disques fins -->
  <g class="bb_hhp_bar">
    <line x1="108" y1="132" x2="148" y2="132" stroke="#e6edf3" stroke-width="3" stroke-linecap="round"/>
    <circle cx="136" cy="132" r="10" fill="#1f2937" stroke="#38bdf8" stroke-width="2.2"/>
    <circle cx="136" cy="132" r="3" fill="#e6edf3"/>
  </g>

  <text x="16" y="24" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600">BARRE · HANG PULL</text>
  <text x="224" y="24" text-anchor="end" fill="#10b981" font-family="system-ui,sans-serif" font-size="9">HIP SNAP RAPIDE</text>
</svg>
