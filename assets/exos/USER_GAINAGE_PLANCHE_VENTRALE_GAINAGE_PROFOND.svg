<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="Planche ventrale sur avant-bras pour gainage profond">
  <style>
    .ugpv-anim {
      --base-dur: 3.6s;
      animation-duration: calc(var(--base-dur, 3.6s) / var(--anim-speed, 1));
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-play-state: var(--anim-state, running);
    }
    .ugpv-body { animation-name: ugpv_brace; }
    .ugpv-halo1 { transform-origin: 110px 136px; animation-name: ugpv_ring1; }
    .ugpv-halo2 { transform-origin: 110px 136px; animation-name: ugpv_ring2; }
    .ugpv-arrow { animation-name: ugpv_anti_sag; }
    @keyframes ugpv_brace {
      0%, 100% { transform: translateY(0px); }
      45%, 55% { transform: translateY(-1.5px); }
    }
    @keyframes ugpv_ring1 {
      0%, 100% { transform: scale(0.88); opacity: 0.35; }
      45%, 55% { transform: scale(1.14); opacity: 0.95; }
    }
    @keyframes ugpv_ring2 {
      0%, 100% { transform: scale(1.05); opacity: 0.15; }
      45%, 55% { transform: scale(1.38); opacity: 0.55; }
    }
    @keyframes ugpv_anti_sag {
      0%, 100% { transform: translateY(2px); opacity: 0.45; }
      45%, 55% { transform: translateY(-2px); opacity: 1; }
    }
  </style>
  <rect width="240" height="220" rx="12" fill="#0d1117" />
  <text x="120" y="20" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="9" font-weight="600" letter-spacing="0.8">PLANCHE VENTRALE • GAINAGE PROFOND</text>

  <!-- Sol et tapis au sol -->
  <line x1="16" y1="170" x2="224" y2="170" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
  <rect x="28" y="162" width="184" height="6" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1" />

  <!-- Halo animé autour du caisson abdominal profond (transverse) -->
  <ellipse cx="110" cy="136" rx="22" ry="11" fill="none" stroke="#10b981" stroke-width="1.4" stroke-dasharray="3 2" class="ugpv-anim ugpv-halo1" />
  <ellipse cx="110" cy="136" rx="28" ry="15" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.4" class="ugpv-anim ugpv-halo2" />

  <!-- Flèches vertes anti-affaissement sous le bassin -->
  <g class="ugpv-anim ugpv-arrow" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M122 157 L122 146 M119 150 L122 145 L125 150" />
    <path d="M138 157 L138 146 M135 150 L138 145 L141 150" />
  </g>

  <!-- Appuis stables au sol : avant-bras et pointes de pieds -->
  <path d="M46 160 L68 160 L68 128" fill="none" stroke="#94a3b8" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M193 144 L193 160 L201 160" fill="none" stroke="#cbd5e1" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Corps aligné en planche ventrale -->
  <g class="ugpv-anim ugpv-body">
    <!-- Jambes alignées -->
    <line x1="133" y1="136" x2="193" y2="144" stroke="#cbd5e1" stroke-width="5.5" stroke-linecap="round" />
    <!-- Caisson abdominal & buste -->
    <path d="M68 123 L133 131 L133 142 L68 134 Z" fill="#1e293b" stroke="#475569" stroke-width="1.4" stroke-linejoin="round" />
    <!-- Tête neutre (regard au sol) -->
    <circle cx="46" cy="123" r="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" />
    <!-- Rachis lombaire neutre horizontal en vert #10b981 -->
    <line x1="72" y1="128" x2="132" y2="136" stroke="#10b981" stroke-width="4.2" stroke-linecap="round" />
    <!-- Ligne d'alignement pointillée cyan (oreille-épaule-hanche-cheville) -->
    <line x1="48" y1="125" x2="193" y2="144" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="4 3" opacity="0.8" />
    <!-- Articulations cyan -->
    <circle cx="48" cy="125" r="2.8" fill="#22d3ee" />
    <circle cx="68" cy="128" r="3.8" fill="#22d3ee" />
    <circle cx="133" cy="136" r="3.8" fill="#22d3ee" />
    <circle cx="193" cy="144" r="3.2" fill="#22d3ee" />
  </g>
  <circle cx="68" cy="160" r="3.4" fill="#22d3ee" />

  <text x="120" y="208" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="8.5" font-weight="600">Transverse engagé • Bassin neutre • Zéro cambrure</text>
</svg>
