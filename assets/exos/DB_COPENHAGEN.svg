<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="DB_COPENHAGEN : adducteurs Copenhagen isométrique sur banc">
  <style>
    .iso-bridge {
      --base-dur: 3.0s;
      animation: DB_COPENHAGEN_iso calc(var(--base-dur, 3.2s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .iso-ring {
      --base-dur: 3.0s;
      animation: DB_COPENHAGEN_pulse calc(var(--base-dur, 3.2s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    @keyframes DB_COPENHAGEN_iso {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-1.5px); }
    }
    @keyframes DB_COPENHAGEN_pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
  </style>

  <rect width="240" height="220" rx="14" fill="#0d1117"/>
  <line x1="20" y1="184" x2="220" y2="184" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

  <!-- Banc surélévation à droite -->
  <rect x="148" y="132" width="54" height="52" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- Avant-bras d'appui au sol à gauche -->
  <polyline points="54,182 70,182 70,140" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="70" cy="182" r="2.8" fill="#f8fafc"/>

  <!-- Corps en gainage latéral isométrique -->
  <g class="iso-bridge">
    <!-- Ligne rachis / bassin aligné en vert -->
    <line x1="70" y1="138" x2="122" y2="134" stroke="#10b981" stroke-width="6.5" stroke-linecap="round"/>
    <!-- Tête alignée -->
    <circle cx="48" cy="136" r="8" fill="#cbd5e1"/>
    <!-- Jambe supérieure en appui sur banc -->
    <line x1="122" y1="134" x2="178" y2="130" stroke="#cbd5e1" stroke-width="6.2" stroke-linecap="round"/>
    <!-- Jambe inférieure suspendue sous le banc -->
    <line x1="122" y1="142" x2="164" y2="156" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
    <!-- Haltère optionnel sur hanche -->
    <rect x="114" y="118" width="16" height="7" rx="2" fill="#64748b" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="116" y="116" width="4" height="11" rx="1" fill="#e2e8f0"/>
    <rect x="124" y="116" width="4" height="11" rx="1" fill="#e2e8f0"/>

    <circle cx="70" cy="138" r="3" fill="#22d3ee"/>
    <circle cx="122" cy="134" r="3.4" fill="#22d3ee"/>
    <circle cx="154" cy="132" r="3" fill="#f8fafc"/>
  </g>

  <!-- Repère maintien isométrique -->
  <g class="iso-ring">
    <line x1="94" y1="150" x2="94" y2="178" stroke="#10b981" stroke-width="1.8" stroke-dasharray="3 3"/>
    <text x="120" y="203" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600">ISOMÉTRIE ADDUCTEURS · BASSIN ALIGNÉ</text>
  </g>

  <text x="16" y="24" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600">DB · COPENHAGEN</text>
  <text x="224" y="24" text-anchor="end" fill="#10b981" font-family="system-ui,sans-serif" font-size="9">HOLD ISO</text>
</svg>
