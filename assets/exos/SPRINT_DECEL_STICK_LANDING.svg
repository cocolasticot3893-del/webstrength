<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="Décélération contrôlée et blocage stick : freinage excentrique, abaissement du centre de gravité et arrêt stable">
  <style>
    .sprint_decel_body {
      --base-dur: 1.8s;
      transform-origin: 128px 184px;
      animation: sprint_decel_stop calc(var(--base-dur, 1.8s) / var(--anim-speed, 1)) ease-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .sprint_decel_com {
      --base-dur: 1.8s;
      animation: sprint_decel_drop calc(var(--base-dur, 1.8s) / var(--anim-speed, 1)) ease-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .sprint_decel_brake {
      --base-dur: 1.8s;
      animation: sprint_decel_force calc(var(--base-dur, 1.8s) / var(--anim-speed, 1)) ease-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .sprint_decel_trail {
      --base-dur: 1.8s;
      animation: sprint_decel_fade calc(var(--base-dur, 1.8s) / var(--anim-speed, 1)) ease-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .sprint_decel_stick {
      --base-dur: 1.8s;
      transform-origin: 162px 186px;
      animation: sprint_decel_lock calc(var(--base-dur, 1.8s) / var(--anim-speed, 1)) ease-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    @keyframes sprint_decel_stop {
      0% { transform: translate(-24px, -12px) scaleY(1.04); }
      38% { transform: translate(0px, 2px) scaleY(0.95); }
      46%, 84% { transform: translate(0px, 2px) scaleY(0.96); }
      100% { transform: translate(-24px, -12px) scaleY(1.04); }
    }
    @keyframes sprint_decel_drop {
      0%, 10% { opacity: 0.2; transform: translateY(-10px); }
      38%, 84% { opacity: 1; transform: translateY(2px); }
      100% { opacity: 0.2; transform: translateY(-10px); }
    }
    @keyframes sprint_decel_force {
      0%, 12% { opacity: 0.15; transform: translateX(6px); }
      36%, 68% { opacity: 1; transform: translateX(-3px); }
      84%, 100% { opacity: 0.2; transform: translateX(4px); }
    }
    @keyframes sprint_decel_fade {
      0% { opacity: 0.9; transform: translateX(-6px); }
      42%, 86% { opacity: 0.12; transform: translateX(6px); }
      100% { opacity: 0.9; transform: translateX(-6px); }
    }
    @keyframes sprint_decel_lock {
      0%, 38% { opacity: 0.12; transform: scale(0.82); }
      46%, 84% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.12; transform: scale(0.82); }
    }
  </style>

  <rect width="240" height="220" rx="14" fill="#0d1117"/>

  <!-- Sol et zone d'arrêt stick -->
  <line x1="18" y1="186" x2="222" y2="186" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>
  <rect x="144" y="183" width="34" height="6" rx="3" fill="#10b981" fill-opacity="0.28" stroke="#10b981" stroke-width="1.2"/>
  <line x1="178" y1="176" x2="178" y2="194" stroke="#10b981" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Traînée de course entrante qui s'éteint au freinage -->
  <g class="sprint_decel_trail">
    <line x1="22" y1="96" x2="66" y2="96" stroke="#8b949e" stroke-width="1.8" stroke-dasharray="9 5" stroke-linecap="round"/>
    <line x1="18" y1="118" x2="58" y2="118" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="7 4" stroke-linecap="round"/>
    <line x1="26" y1="140" x2="62" y2="140" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6 5" stroke-linecap="round"/>
  </g>

  <!-- Flèche d'abaissement du centre de gravité (COM) -->
  <g class="sprint_decel_com">
    <line x1="84" y1="96" x2="84" y2="136" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round"/>
    <polyline points="79,129 84,138 89,129" fill="none" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="84" y="89" text-anchor="middle" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="8" font-weight="600">CDG</text>
  </g>

  <!-- Flèches de freinage excentrique (force opposée au mouvement) -->
  <g class="sprint_decel_brake">
    <line x1="216" y1="126" x2="182" y2="126" stroke="#f59e0b" stroke-width="2.8" stroke-linecap="round"/>
    <polyline points="190,120 180,126 190,132" fill="none" stroke="#f59e0b" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="166" y1="182" x2="142" y2="164" stroke="#f59e0b" stroke-width="2.2" stroke-dasharray="4 3" stroke-linecap="round"/>
    <polyline points="145,172 140,163 150,164" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Athlète en posture basse de freinage et blocage stick -->
  <g class="sprint_decel_body">
    <!-- Jambe arrière basse stabilisatrice -->
    <polyline points="124,136 108,162 96,183 105,184" fill="none" stroke="#8b949e" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Jambe avant en freinage excentrique plantée devant le CDG -->
    <polyline points="124,136 151,152 162,183 173,184" fill="none" stroke="#e6edf3" stroke-width="5.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Tronc gainé bas et contrôlé -->
    <line x1="124" y1="136" x2="132" y2="98" stroke="#10b981" stroke-width="7.5" stroke-linecap="round"/>
    <!-- Bras d'équilibrage -->
    <polyline points="132,98 110,114 98,122" fill="none" stroke="#8b949e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="132,98 153,115 167,111" fill="none" stroke="#e6edf3" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Tête et repères articulaires -->
    <circle cx="134" cy="82" r="8.2" fill="#e6edf3"/>
    <circle cx="151" cy="152" r="2.8" fill="#f59e0b"/>
    <circle cx="108" cy="162" r="2.6" fill="#e6edf3"/>
    <circle cx="162" cy="183" r="3" fill="#f59e0b"/>
    <!-- Centre de gravité abaissé -->
    <circle cx="124" cy="136" r="4.2" fill="#38bdf8" stroke="#0d1117" stroke-width="1.2"/>
  </g>

  <!-- Indicateur de blocage stable STICK -->
  <g class="sprint_decel_stick">
    <rect x="176" y="150" width="46" height="18" rx="4" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1.3"/>
    <text x="199" y="162" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="8.5" font-weight="700">STICK</text>
  </g>

  <text x="16" y="24" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600">SPRINT · DECEL STICK</text>
  <text x="224" y="24" text-anchor="end" fill="#10b981" font-family="system-ui,sans-serif" font-size="9">FREINAGE EXCENTR.</text>
</svg>
