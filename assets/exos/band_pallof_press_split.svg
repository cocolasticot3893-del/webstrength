<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="Pallof press en fente split basse avec élastique latéral">
  <style>
    .bpps_hands {
      --base-dur: 2.8s;
      animation: bpps_press calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .bpps_band {
      --base-dur: 2.8s;
      transform-origin: 28px 94px;
      animation: bpps_stretch calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .bpps_shield {
      --base-dur: 2.8s;
      animation: bpps_anti calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    @keyframes bpps_press {
      0%, 100% { transform: translate(0px, 0px) scale(0.92); }
      45%, 55% { transform: translate(24px, 10px) scale(1.06); }
    }
    @keyframes bpps_stretch {
      0%, 100% { transform: scaleX(1) rotate(0deg); }
      45%, 55% { transform: scaleX(1.25) rotate(6deg); }
    }
    @keyframes bpps_anti {
      0%, 100% { opacity: 0.25; }
      45%, 55% { opacity: 1; }
    }
  </style>

  <rect width="240" height="220" rx="14" fill="#0d1117"/>

  <!-- Sol et poteau d'ancrage gauche -->
  <line x1="20" y1="184" x2="220" y2="184" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="54" x2="28" y2="184" stroke="#30363d" stroke-width="5" stroke-linecap="round"/>
  <circle cx="28" cy="94" r="4.5" fill="#38bdf8"/>

  <!-- Fente split basse (jambe avant fléchie 90°, jambe arrière basse) -->
  <polyline points="116,132 104,158 84,182" fill="none" stroke="#8b949e" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="128,132 146,144 146,182" fill="none" stroke="#e6edf3" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="142" y1="182" x2="156" y2="182" stroke="#e6edf3" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="104" cy="158" r="2.8" fill="#8b949e"/>
  <circle cx="146" cy="144" r="3" fill="#10b981"/>

  <!-- Torse droit gainé anti-rotation -->
  <path d="M108,84 L136,84 L130,132 L114,132 Z" fill="#1f2937" stroke="#10b981" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="122" y1="86" x2="122" y2="130" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <circle cx="122" cy="66" r="8" fill="#e6edf3"/>

  <!-- Élastique tendu depuis l'ancrage gauche -->
  <g class="bpps_band">
    <line x1="28" y1="94" x2="122" y2="96" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Bras et mains poussant droit devant le sternum -->
  <g class="bpps_hands">
    <line x1="112" y1="90" x2="126" y2="96" stroke="#e6edf3" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="134" y1="90" x2="126" y2="96" stroke="#e6edf3" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="126" cy="96" r="4.5" fill="#f59e0b" stroke="#e6edf3" stroke-width="1.2"/>
  </g>

  <!-- Indicateur anti-rotation -->
  <g class="bpps_shield">
    <path d="M168 102 L192 102 M186 97 L193 102 L186 107" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="180" y="92" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="7.5" font-weight="700">ANTI-ROT</text>
  </g>

  <text x="16" y="21" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9" font-weight="600">CORE · PALLOF SPLIT</text>
  <text x="224" y="21" text-anchor="end" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="8.5" font-weight="600">TENSION LATÉRALE</text>
  <text x="120" y="206" text-anchor="middle" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600">PALLOF PRESS FENTE · ANTI-ROTATION</text>
</svg>
