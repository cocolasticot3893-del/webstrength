<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="Tirage horizontal à l'élastique avec rétraction scapulaire">
  <style>
    .uthe-anim {
      --base-dur: 3.2s;
      animation-duration: calc(var(--base-dur, 3.2s) / var(--anim-speed, 1));
      animation-timing-function: ease-in-out;
      animation-iteration-count: infinite;
      animation-play-state: var(--anim-state, running);
    }
    .uthe-upper { transform-origin: 152px 74px; animation-name: uthe_humerus; }
    .uthe-forearm { transform-origin: 120px 92px; animation-name: uthe_forearm; }
    .uthe-band { transform-origin: 24px 104px; animation-name: uthe_stretch; }
    .uthe-scap { animation-name: uthe_retract; }
    @keyframes uthe_humerus {
      0%, 100% { transform: rotate(0deg); }
      42%, 58% { transform: rotate(-103.5deg); }
    }
    @keyframes uthe_forearm {
      0%, 100% { transform: rotate(0deg); }
      42%, 58% { transform: rotate(121.7deg); }
    }
    @keyframes uthe_stretch {
      0%, 100% { transform: rotate(0deg) scaleX(1); }
      21%, 79% { transform: rotate(8.3deg) scaleX(1.39); }
      42%, 58% { transform: rotate(-0.5deg) scaleX(1.83); }
    }
    @keyframes uthe_retract {
      0%, 20%, 80%, 100% { transform: translateX(0px); opacity: 0.25; }
      42%, 58% { transform: translateX(4px); opacity: 1; }
    }
  </style>
  <rect width="240" height="220" rx="12" fill="#0d1117" />
  <line x1="16" y1="194" x2="224" y2="194" stroke="#1e293b" stroke-width="2" />
  <text x="120" y="20" text-anchor="middle" fill="#64748b" font-family="system-ui,sans-serif" font-size="9" font-weight="600" letter-spacing="0.8">TIRAGE HORIZONTAL • ÉLASTIQUE</text>

  <!-- Poteau d'ancrage à gauche, attache à hauteur sternum / côtes basses (y=104) -->
  <rect x="16" y="42" width="8" height="152" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
  <circle cx="24" cy="104" r="4.5" fill="#f59e0b" />

  <!-- Posture fente athlétique face à gauche -->
  <circle cx="152" cy="48" r="11" fill="#1e293b" stroke="#94a3b8" stroke-width="2" />
  <path d="M142 64 L164 64 L162 122 L144 122 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" />
  <!-- Rachis neutre vertical -->
  <line x1="156" y1="66" x2="156" y2="120" stroke="#10b981" stroke-width="4" stroke-linecap="round" />

  <!-- Jambes stables en fente -->
  <path d="M148 122 L134 156 L132 190 L120 191" fill="none" stroke="#94a3b8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M158 122 L170 156 L176 190 L164 191" fill="none" stroke="#cbd5e1" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="153" cy="122" r="4" fill="#22d3ee" />
  <circle cx="134" cy="156" r="3.5" fill="#22d3ee" />
  <circle cx="170" cy="156" r="3.5" fill="#22d3ee" />

  <!-- Élastique horizontal ambre / cyan vers la main -->
  <g class="uthe-anim uthe-band">
    <line x1="24" y1="102.5" x2="90" y2="102.5" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round" vector-effect="non-scaling-stroke" />
    <line x1="24" y1="105.5" x2="90" y2="105.5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" vector-effect="non-scaling-stroke" />
  </g>

  <!-- Bras articulé : coude tiré vers l'arrière le long des côtes -->
  <g class="uthe-anim uthe-upper">
    <line x1="152" y1="74" x2="120" y2="92" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" />
    <g class="uthe-anim uthe-forearm">
      <line x1="120" y1="92" x2="90" y2="104" stroke="#e2e8f0" stroke-width="4.5" stroke-linecap="round" />
      <circle cx="90" cy="104" r="4" fill="#22d3ee" />
    </g>
    <circle cx="120" cy="92" r="4" fill="#22d3ee" />
  </g>
  <circle cx="152" cy="74" r="4.5" fill="#22d3ee" />

  <!-- Flèche de rétraction scapulaire derrière l'omoplate en fin de tirage -->
  <path d="M174 74 L194 74 M188 69 L195 74 L188 79" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="uthe-anim uthe-scap" />

  <text x="120" y="208" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="8.5" font-weight="600">Omoplates serrées • Coudes bas • Buste verrouillé</text>
</svg>
