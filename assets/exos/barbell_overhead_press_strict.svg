<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="Développé militaire strict barre debout">
  <style>
    .bops_bar {
      --base-dur: 2.8s;
      animation: bops_press calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .bops_arm_l {
      --base-dur: 2.8s;
      transform-origin: 102px 86px;
      animation: bops_arm_up calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .bops_arm_r {
      --base-dur: 2.8s;
      transform-origin: 138px 86px;
      animation: bops_arm_up calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .bops_vec {
      --base-dur: 2.8s;
      animation: bops_glow calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    @keyframes bops_press {
      0%, 100% { transform: translateY(38px); }
      45%, 55% { transform: translateY(0px); }
    }
    @keyframes bops_arm_up {
      0%, 100% { transform: scaleY(-0.35); }
      45%, 55% { transform: scaleY(1); }
    }
    @keyframes bops_glow {
      0%, 100% { opacity: 0.25; }
      45%, 55% { opacity: 1; }
    }
  </style>

  <rect width="240" height="220" rx="14" fill="#0d1117"/>

  <!-- Sol -->
  <line x1="20" y1="184" x2="220" y2="184" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>

  <!-- Pilier strict : jambes verrouillées + gainage fessiers/abdos -->
  <line x1="112" y1="182" x2="112" y2="126" stroke="#8b949e" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="128" y1="182" x2="128" y2="126" stroke="#8b949e" stroke-width="5.5" stroke-linecap="round"/>
  <line x1="106" y1="182" x2="116" y2="182" stroke="#e6edf3" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="124" y1="182" x2="134" y2="182" stroke="#e6edf3" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Genoux strictement verrouillés -->
  <circle cx="112" cy="154" r="2.8" fill="#38bdf8"/>
  <circle cx="128" cy="154" r="2.8" fill="#38bdf8"/>

  <!-- Torse gainé vertical -->
  <path d="M102,86 L138,86 L130,126 L110,126 Z" fill="#1f2937" stroke="#10b981" stroke-width="2.2" stroke-linejoin="round"/>
  <line x1="120" y1="88" x2="120" y2="124" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>

  <!-- Tête -->
  <circle cx="120" cy="68" r="8.2" fill="#e6edf3"/>

  <!-- Bras en poussée verticale -->
  <g class="bops_arm_l">
    <line x1="102" y1="86" x2="94" y2="46" stroke="#e6edf3" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g class="bops_arm_r">
    <line x1="138" y1="86" x2="146" y2="46" stroke="#e6edf3" stroke-width="5" stroke-linecap="round"/>
  </g>
  <circle cx="102" cy="86" r="3" fill="#10b981"/>
  <circle cx="138" cy="86" r="3" fill="#10b981"/>

  <!-- Barre olympique et disques -->
  <g class="bops_bar">
    <line x1="60" y1="46" x2="180" y2="46" stroke="#e6edf3" stroke-width="3.2" stroke-linecap="round"/>
    <rect x="64" y="34" width="6" height="24" rx="2" fill="#38bdf8"/>
    <rect x="170" y="34" width="6" height="24" rx="2" fill="#38bdf8"/>
    <circle cx="94" cy="46" r="3.5" fill="#f59e0b"/>
    <circle cx="146" cy="46" r="3.5" fill="#f59e0b"/>
  </g>

  <!-- Flèche verticale de poussée stricte -->
  <g class="bops_vec">
    <path d="M196 90 L196 44 M191 52 L196 42 L201 52" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="16" y="21" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9" font-weight="600">UPPER · OHP BARBELL</text>
  <text x="224" y="21" text-anchor="end" fill="#10b981" font-family="system-ui,sans-serif" font-size="8.5" font-weight="600">ZÉRO ÉLAN</text>
  <text x="120" y="206" text-anchor="middle" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600">DÉVELOPPÉ MILITAIRE · STRICT</text>
</svg>
