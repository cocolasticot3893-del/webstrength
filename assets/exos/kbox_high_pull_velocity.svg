<svg viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="kBox high pull vitesse : triple extension rapide et tirage coudes hauts">
  <style>
    .kbox_hpv_fly {
      --base-dur: 0.9s;
      transform-origin: 120px 180px;
      animation: kbox_hpv_spin calc(var(--base-dur, 1.6s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .kbox_hpv_body {
      --base-dur: 1.3s;
      transform-origin: 120px 170px;
      animation: kbox_hpv_ext calc(var(--base-dur, 1.6s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .kbox_hpv_arms {
      --base-dur: 1.3s;
      transform-origin: 120px 78px;
      animation: kbox_hpv_pull calc(var(--base-dur, 1.6s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .kbox_hpv_strap {
      --base-dur: 1.3s;
      transform-origin: 120px 172px;
      animation: kbox_hpv_str calc(var(--base-dur, 1.6s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .kbox_hpv_streak {
      --base-dur: 1.3s;
      animation: kbox_hpv_flash calc(var(--base-dur, 1.6s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    @keyframes kbox_hpv_spin {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(360deg); }
      100% { transform: rotate(720deg); }
    }
    @keyframes kbox_hpv_ext {
      0%, 100% { transform: translateY(14px) scaleY(0.92); }
      55%, 70% { transform: translateY(-6px) scaleY(1.03); }
    }
    @keyframes kbox_hpv_pull {
      0%, 100% { transform: translateY(28px); }
      55%, 70% { transform: translateY(-8px); }
    }
    @keyframes kbox_hpv_str {
      0%, 100% { transform: scaleY(0.62); }
      55%, 70% { transform: scaleY(1.12); }
    }
    @keyframes kbox_hpv_flash {
      0%, 20%, 88%, 100% { opacity: 0.15; transform: translateY(8px); }
      50%, 70% { opacity: 1; transform: translateY(-6px); }
    }
  </style>

  <rect width="240" height="220" rx="14" fill="#0d1117"/>
  <line x1="20" y1="190" x2="220" y2="190" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

  <!-- Plateforme kBox -->
  <rect x="64" y="172" width="112" height="16" rx="4" fill="#1f2937" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="120" cy="180" r="8" fill="#0d1117" stroke="#8b949e" stroke-width="1.4"/>
  <g class="kbox_hpv_fly">
    <line x1="120" y1="173" x2="120" y2="187" stroke="#10b981" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="113" y1="180" x2="127" y2="180" stroke="#38bdf8" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- Sangle verticale -->
  <line class="kbox_hpv_strap" x1="120" y1="172" x2="120" y2="92" stroke="#38bdf8" stroke-width="2.4" stroke-dasharray="4 3" stroke-linecap="round"/>

  <!-- Stries de vitesse émeraude -->
  <g class="kbox_hpv_streak">
    <line x1="56" y1="138" x2="56" y2="78" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>
    <line x1="184" y1="138" x2="184" y2="78" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>
    <polyline points="50,86 56,74 62,86" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="178,86 184,74 190,86" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="72" y1="120" x2="72" y2="90" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.7" stroke-linecap="round"/>
    <line x1="168" y1="120" x2="168" y2="90" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.7" stroke-linecap="round"/>
  </g>

  <!-- Athlète en triple extension -->
  <g class="kbox_hpv_body">
    <!-- Pieds / chevilles en extension -->
    <polyline points="103,170 107,165 110,136 116,104" fill="none" stroke="#8b949e" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="137,170 133,165 130,136 124,104" fill="none" stroke="#8b949e" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Tronc vertical émeraude -->
    <line x1="120" y1="104" x2="120" y2="66" stroke="#10b981" stroke-width="7" stroke-linecap="round"/>
    <!-- Tête -->
    <circle cx="120" cy="51" r="8.5" fill="#e6edf3"/>
    <!-- Repères articulaires -->
    <circle cx="110" cy="136" r="2.8" fill="#e6edf3"/>
    <circle cx="130" cy="136" r="2.8" fill="#e6edf3"/>
    <circle cx="120" cy="104" r="3.4" fill="#38bdf8"/>

    <!-- Coudes hauts + barre droite -->
    <g class="kbox_hpv_arms">
      <polyline points="116,70 86,60 96,86" fill="none" stroke="#e6edf3" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="124,70 154,60 144,86" fill="none" stroke="#e6edf3" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Barre droite tirée haut -->
      <line x1="88" y1="86" x2="152" y2="86" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
      <circle cx="86" cy="60" r="2.8" fill="#10b981"/>
      <circle cx="154" cy="60" r="2.8" fill="#10b981"/>
    </g>
  </g>

  <text x="16" y="24" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600">kBox · HIGH PULL</text>
  <text x="224" y="24" text-anchor="end" fill="#10b981" font-family="system-ui,sans-serif" font-size="9">TRIPLE EXT VITESSE</text>
</svg>
