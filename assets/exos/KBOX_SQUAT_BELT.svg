<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="KBOX_SQUAT_BELT : belt squat pelvien rachis déchargé sur kBox">
  <style>
    .kbox-fly {
      --base-dur: 1.6s;
      transform-origin: 120px 179px;
      animation: KBOX_SQUAT_BELT_fly calc(var(--base-dur, 1.6s) / var(--anim-speed, 1)) linear infinite;
      animation-play-state: var(--anim-state, running);
    }
    .shin {
      --base-dur: 3.4s;
      transform-origin: 126px 170px;
      animation: KBOX_SQUAT_BELT_shin calc(var(--base-dur, 3.2s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .thigh {
      --base-dur: 3.4s;
      transform-origin: 126px 132px;
      animation: KBOX_SQUAT_BELT_thigh calc(var(--base-dur, 3.2s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .torso {
      --base-dur: 3.4s;
      transform-origin: 126px 96px;
      animation: KBOX_SQUAT_BELT_torso calc(var(--base-dur, 3.2s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .strap {
      --base-dur: 3.4s;
      transform-origin: 120px 172px;
      animation: KBOX_SQUAT_BELT_strap calc(var(--base-dur, 3.2s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .ecc-zone {
      --base-dur: 3.4s;
      animation: KBOX_SQUAT_BELT_ecc calc(var(--base-dur, 3.2s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .con-arrow {
      --base-dur: 3.4s;
      animation: KBOX_SQUAT_BELT_con calc(var(--base-dur, 3.2s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    @keyframes KBOX_SQUAT_BELT_fly {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes KBOX_SQUAT_BELT_shin {
      0%, 100% { transform: rotate(4deg); }
      45%, 55% { transform: rotate(22deg); }
    }
    @keyframes KBOX_SQUAT_BELT_thigh {
      0%, 100% { transform: rotate(-10deg); }
      45%, 55% { transform: rotate(-88deg); }
    }
    @keyframes KBOX_SQUAT_BELT_torso {
      0%, 100% { transform: rotate(6deg); }
      45%, 55% { transform: rotate(66deg); }
    }
    @keyframes KBOX_SQUAT_BELT_strap {
      0%, 100% { transform: scaleY(1); }
      45%, 55% { transform: scaleY(0.54); }
    }
    @keyframes KBOX_SQUAT_BELT_ecc {
      0%, 24%, 72%, 100% { opacity: 0.12; }
      38%, 55% { opacity: 0.95; }
    }
    @keyframes KBOX_SQUAT_BELT_con {
      0%, 55%, 95%, 100% { opacity: 0.15; }
      68%, 85% { opacity: 1; }
    }
  </style>

  <rect width="240" height="220" rx="14" fill="#0d1117"/>
  <line x1="20" y1="188" x2="220" y2="188" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

  <!-- Poignée stabilité avant -->
  <path d="M164 172 L164 88 L150 88" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Plateforme kBox4 -->
  <rect x="62" y="172" width="116" height="16" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="120" cy="179" r="9" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <g class="kbox-fly">
    <line x1="120" y1="171" x2="120" y2="187" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="112" y1="179" x2="128" y2="179" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Zone freinage excentrique -->
  <g class="ecc-zone">
    <rect x="74" y="128" width="84" height="32" rx="6" fill="#ef4444" fill-opacity="0.14" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 3"/>
    <path d="M48 124 L48 152 M43 146 L48 153 L53 146" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Flèche concentrique -->
  <g class="con-arrow">
    <path d="M192 142 L192 92 M187 99 L192 91 L197 99" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Traction directe sous bassin -->
  <line class="strap" x1="120" y1="172" x2="120" y2="98" stroke="#38bdf8" stroke-width="2.8" stroke-dasharray="5 3" stroke-linecap="round"/>

  <path d="M120 170 L140 170" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <g class="shin">
    <line x1="126" y1="170" x2="126" y2="132" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <g class="thigh">
      <line x1="126" y1="132" x2="126" y2="96" stroke="#cbd5e1" stroke-width="6.5" stroke-linecap="round"/>
      <g class="torso">
        <!-- Rachis vertical 100% déchargé -->
        <line x1="126" y1="96" x2="126" y2="54" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
        <!-- Ceinture pelvienne -->
        <rect x="116" y="92" width="20" height="7" rx="3" fill="#f59e0b"/>
        <!-- Bras vers barre d'appui -->
        <polyline points="126,60 144,78 154,88" fill="none" stroke="#e2e8f0" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="127" cy="40" r="8.5" fill="#cbd5e1"/>
        <circle cx="126" cy="58" r="3" fill="#22d3ee"/>
      </g>
      <circle cx="126" cy="96" r="3.4" fill="#22d3ee"/>
    </g>
    <circle cx="126" cy="132" r="3.2" fill="#f8fafc"/>
  </g>
  <circle cx="126" cy="170" r="2.8" fill="#22d3ee"/>

  <text x="16" y="24" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600">kBox4 · BELT SQUAT</text>
  <text x="224" y="24" text-anchor="end" fill="#10b981" font-family="system-ui,sans-serif" font-size="9">RACHIS 0% CHARGE</text>
</svg>
