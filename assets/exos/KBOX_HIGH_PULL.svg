<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="KBOX_HIGH_PULL : tirage haut rowing poignées sur kBox">
  <style>
    .kbox-fly {
      --base-dur: 1.6s;
      transform-origin: 120px 179px;
      animation: KBOX_HIGH_PULL_fly calc(var(--base-dur, 1.6s) / var(--anim-speed, 1)) linear infinite;
      animation-play-state: var(--anim-state, running);
    }
    .upper-arm {
      --base-dur: 3.2s;
      transform-origin: 122px 68px;
      animation: KBOX_HIGH_PULL_uarm calc(var(--base-dur, 3.2s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .forearm {
      --base-dur: 3.2s;
      transform-origin: 132px 98px;
      animation: KBOX_HIGH_PULL_farm calc(var(--base-dur, 3.2s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .strap {
      --base-dur: 3.2s;
      transform-origin: 120px 172px;
      animation: KBOX_HIGH_PULL_strap calc(var(--base-dur, 3.2s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .ecc-zone {
      --base-dur: 3.2s;
      animation: KBOX_HIGH_PULL_ecc calc(var(--base-dur, 3.2s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .con-arrow {
      --base-dur: 3.2s;
      animation: KBOX_HIGH_PULL_con calc(var(--base-dur, 3.2s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    @keyframes KBOX_HIGH_PULL_fly {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes KBOX_HIGH_PULL_uarm {
      0%, 100% { transform: rotate(-18deg); }
      45%, 55% { transform: rotate(62deg); }
    }
    @keyframes KBOX_HIGH_PULL_farm {
      0%, 100% { transform: rotate(16deg); }
      45%, 55% { transform: rotate(-92deg); }
    }
    @keyframes KBOX_HIGH_PULL_strap {
      0%, 100% { transform: scaleY(0.65); }
      45%, 55% { transform: scaleY(1.18); }
    }
    @keyframes KBOX_HIGH_PULL_ecc {
      0%, 10%, 72%, 100% { opacity: 0.9; }
      35%, 60% { opacity: 0.14; }
    }
    @keyframes KBOX_HIGH_PULL_con {
      0%, 15%, 70%, 100% { opacity: 0.15; }
      30%, 52% { opacity: 1; }
    }
  </style>

  <rect width="240" height="220" rx="14" fill="#0d1117"/>
  <line x1="20" y1="188" x2="220" y2="188" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

  <!-- Plateforme kBox4 -->
  <rect x="62" y="172" width="116" height="16" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="120" cy="179" r="9" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <g class="kbox-fly">
    <line x1="120" y1="171" x2="120" y2="187" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="112" y1="179" x2="128" y2="179" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Zone freinage bas excentrique -->
  <g class="ecc-zone">
    <rect x="114" y="122" width="46" height="32" rx="6" fill="#ef4444" fill-opacity="0.14" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 3"/>
    <path d="M168 122 L168 150 M163 144 L168 151 L173 144" fill="none" stroke="#ef4444" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Flèche concentrique tirage -->
  <g class="con-arrow">
    <path d="M188 126 L188 68 M183 75 L188 67 L193 75" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sangle poignées -->
  <line class="strap" x1="120" y1="172" x2="136" y2="112" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="5 3" stroke-linecap="round"/>

  <!-- Posture athlétique buste gainé -->
  <path d="M112 170 L132 170" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <line x1="116" y1="170" x2="124" y2="136" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="124" y1="136" x2="104" y2="102" stroke="#cbd5e1" stroke-width="6.5" stroke-linecap="round"/>
  <line x1="104" y1="102" x2="122" y2="68" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <circle cx="132" cy="54" r="8.5" fill="#cbd5e1"/>

  <!-- Bras + coude montant haut/arrière -->
  <g class="upper-arm">
    <line x1="122" y1="68" x2="132" y2="98" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
    <g class="forearm">
      <line x1="132" y1="98" x2="136" y2="128" stroke="#cbd5e1" stroke-width="4.8" stroke-linecap="round"/>
      <!-- Poignée kBox -->
      <rect x="129" y="125" width="14" height="5" rx="2" fill="#f59e0b"/>
      <circle cx="136" cy="128" r="2.6" fill="#22d3ee"/>
    </g>
    <circle cx="132" cy="98" r="3" fill="#f8fafc"/>
  </g>

  <circle cx="122" cy="68" r="3" fill="#22d3ee"/>
  <circle cx="104" cy="102" r="3.4" fill="#22d3ee"/>
  <circle cx="124" cy="136" r="3.2" fill="#f8fafc"/>
  <circle cx="116" cy="170" r="2.8" fill="#22d3ee"/>

  <text x="16" y="24" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600">kBox4 · HIGH PULL</text>
  <text x="224" y="24" text-anchor="end" fill="#10b981" font-family="system-ui,sans-serif" font-size="9">COUDES HAUT</text>
</svg>
