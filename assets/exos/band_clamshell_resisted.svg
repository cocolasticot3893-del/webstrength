<svg viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="BAND_CLAMSHELL_RESISTED : clamshell avec mini-bande au-dessus des genoux">
  <style>
    .bcl-femur {
      transform-origin: 120px 152px;
      animation: BAND_CLAMSHELL_RESISTED_femur calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .bcl-tibia {
      transform-origin: 164px 162px;
      animation: BAND_CLAMSHELL_RESISTED_tibia calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .bcl-band {
      transform-origin: 156px 162px;
      animation: BAND_CLAMSHELL_RESISTED_band calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .bcl-cue {
      animation: BAND_CLAMSHELL_RESISTED_cue calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    @keyframes BAND_CLAMSHELL_RESISTED_femur {
      0%, 100% { transform: rotate(0deg); }
      45%, 60% { transform: rotate(-30deg); }
    }
    @keyframes BAND_CLAMSHELL_RESISTED_tibia {
      0%, 100% { transform: rotate(0deg); }
      45%, 60% { transform: rotate(-14deg); }
    }
    @keyframes BAND_CLAMSHELL_RESISTED_band {
      0%, 100% { transform: scaleY(0.35); }
      45%, 60% { transform: scaleY(1); }
    }
    @keyframes BAND_CLAMSHELL_RESISTED_cue {
      0%, 25%, 80%, 100% { opacity: 0.25; }
      45%, 60% { opacity: 1; }
    }
  </style>

  <rect width="240" height="220" rx="14" fill="#0d1117"/>
  <!-- Tapis de sol -->
  <line x1="20" y1="180" x2="220" y2="180" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>
  <rect x="28" y="174" width="184" height="5" rx="2.5" fill="#1f2937"/>

  <!-- Jambe inférieure fixe au sol (genou fléchi) -->
  <polyline points="120,156 164,166 130,174" fill="none" stroke="#8b949e" stroke-width="5.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="164" cy="166" r="2.8" fill="#8b949e"/>

  <!-- Bras d'appui sous la tête + tête + buste en décubitus latéral -->
  <polyline points="68,154 44,166 64,172" fill="none" stroke="#8b949e" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="68" y1="154" x2="120" y2="152" stroke="#10b981" stroke-width="6.4" stroke-linecap="round"/>
  <circle cx="52" cy="148" r="8" fill="#e6edf3"/>
  <!-- Bras supérieur stabilisant la hanche -->
  <polyline points="74,152 98,142 118,149" fill="none" stroke="#e6edf3" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Mini-bande élastique au-dessus des genoux -->
  <rect class="bcl-band" x="152" y="138" width="7" height="28" rx="3" fill="#f59e0b" fill-opacity="0.85"/>

  <!-- Jambe supérieure en rotation externe contrôlée -->
  <g class="bcl-femur">
    <line x1="120" y1="152" x2="164" y2="162" stroke="#e6edf3" stroke-width="6.2" stroke-linecap="round"/>
    <g class="bcl-tibia">
      <line x1="164" y1="162" x2="130" y2="174" stroke="#e6edf3" stroke-width="5.5" stroke-linecap="round"/>
      <line x1="130" y1="174" x2="122" y2="171" stroke="#e6edf3" stroke-width="4.2" stroke-linecap="round"/>
    </g>
    <circle cx="164" cy="162" r="3" fill="#38bdf8"/>
  </g>

  <circle cx="120" cy="152" r="3.5" fill="#10b981"/>
  <circle cx="130" cy="174" r="2.6" fill="#38bdf8"/>

  <!-- Arc d'ouverture rotation externe -->
  <g class="bcl-cue">
    <path d="M174 156 Q182 142 170 130" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <path d="M169 136 L170 129 L176 132" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="184" y="128" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="8.5" font-weight="600">MINI-BANDE</text>
  </g>

  <text x="16" y="24" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600">BAND · CLAMSHELL</text>
  <text x="224" y="24" text-anchor="end" fill="#10b981" font-family="system-ui,sans-serif" font-size="9">MOYEN FESSIER</text>
  <text x="120" y="206" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="8.5">ROTATION EXTERNE · BASSIN FIXE</text>
</svg>
