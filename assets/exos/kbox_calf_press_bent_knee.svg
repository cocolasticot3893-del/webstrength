<svg viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="KBOX_CALF_PRESS_BENT_KNEE : élévation de mollets genoux fléchis pour soléaire sur kBox">
  <style>
    .kcb-fly {
      transform-origin: 120px 181px;
      animation: KBOX_CALF_PRESS_BENT_KNEE_fly calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .kcb-lift {
      animation: KBOX_CALF_PRESS_BENT_KNEE_lift calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .kcb-foot {
      transform-origin: 132px 168px;
      animation: KBOX_CALF_PRESS_BENT_KNEE_foot calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .kcb-strap {
      transform-origin: 120px 174px;
      animation: KBOX_CALF_PRESS_BENT_KNEE_strap calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .kcb-cue {
      animation: KBOX_CALF_PRESS_BENT_KNEE_cue calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    @keyframes KBOX_CALF_PRESS_BENT_KNEE_fly {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(300deg); }
    }
    @keyframes KBOX_CALF_PRESS_BENT_KNEE_lift {
      0%, 100% { transform: translateY(3px); }
      45%, 58% { transform: translateY(-13px); }
    }
    @keyframes KBOX_CALF_PRESS_BENT_KNEE_foot {
      0%, 100% { transform: rotate(-10deg); }
      45%, 58% { transform: rotate(28deg); }
    }
    @keyframes KBOX_CALF_PRESS_BENT_KNEE_strap {
      0%, 100% { transform: scaleY(0.97); }
      45%, 58% { transform: scaleY(1.13); }
    }
    @keyframes KBOX_CALF_PRESS_BENT_KNEE_cue {
      0%, 25%, 80%, 100% { opacity: 0.25; }
      45%, 58% { opacity: 1; }
    }
  </style>

  <rect width="240" height="220" rx="14" fill="#0d1117"/>
  <line x1="20" y1="190" x2="220" y2="190" stroke="#1f2937" stroke-width="2" stroke-linecap="round"/>

  <!-- Plateforme kBox + cale avant-pied -->
  <rect x="64" y="174" width="112" height="16" rx="4" fill="#1f2937" stroke="#30363d" stroke-width="1.5"/>
  <rect x="122" y="166" width="20" height="8" rx="2" fill="#30363d"/>
  <circle cx="120" cy="181" r="8" fill="#0d1117" stroke="#8b949e" stroke-width="1.4"/>
  <g class="kcb-fly">
    <line x1="120" y1="174" x2="120" y2="188" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="113" y1="181" x2="127" y2="181" stroke="#8b949e" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- Sangles harnais vers kBox -->
  <line class="kcb-strap" x1="116" y1="174" x2="112" y2="62" stroke="#38bdf8" stroke-width="2.4" stroke-dasharray="4 3" stroke-linecap="round"/>

  <!-- Pied pivotant sur métatarses -->
  <line class="kcb-foot" x1="112" y1="168" x2="136" y2="168" stroke="#8b949e" stroke-width="5.2" stroke-linecap="round"/>

  <!-- Corps genoux fléchis ~28° (ciblage soléaire) -->
  <g class="kcb-lift">
    <!-- Tibia incliné vers l'avant (flexion genou ~28°) -->
    <line x1="114" y1="166" x2="132" y2="128" stroke="#10b981" stroke-width="6.2" stroke-linecap="round"/>
    <!-- Cuisse vers la hanche -->
    <line x1="132" y1="128" x2="114" y2="92" stroke="#e6edf3" stroke-width="6.4" stroke-linecap="round"/>
    <!-- Tronc vertical sous harnais -->
    <line x1="114" y1="92" x2="114" y2="54" stroke="#10b981" stroke-width="6.2" stroke-linecap="round"/>
    <!-- Harnais épaule -->
    <rect x="106" y="54" width="16" height="7" rx="3" fill="#f59e0b"/>
    <!-- Tête -->
    <circle cx="115" cy="40" r="8" fill="#e6edf3"/>
    <!-- Repères articulaires -->
    <circle cx="114" cy="166" r="2.8" fill="#38bdf8"/>
    <circle cx="132" cy="128" r="3.2" fill="#f59e0b"/>
    <circle cx="114" cy="92" r="3.2" fill="#e6edf3"/>
    <circle cx="114" cy="58" r="2.8" fill="#38bdf8"/>
  </g>

  <!-- Flèche élévation talon + arc angle genou -->
  <g class="kcb-cue">
    <path d="M84 166 L84 140 M79 146 L84 139 L89 146" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="150" y="131" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="8.5" font-weight="600">GENOU ~28°</text>
  </g>

  <text x="16" y="24" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600">kBox · CALF BENT KNEE</text>
  <text x="224" y="24" text-anchor="end" fill="#10b981" font-family="system-ui,sans-serif" font-size="9">SOLÉAIRE</text>
  <text x="120" y="206" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="8.5">FLEXION PLANTAIRE SOUS TENSION</text>
</svg>
