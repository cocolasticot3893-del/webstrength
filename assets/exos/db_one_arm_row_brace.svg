<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="Rowing haltère unilatéral avec appui main et genou sur banc">
  <style>
    .doab_db {
      --base-dur: 2.6s;
      animation: doab_pull calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .doab_arm {
      --base-dur: 2.6s;
      transform-origin: 142px 92px;
      animation: doab_elbow calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .doab_vec {
      --base-dur: 2.6s;
      animation: doab_pulse calc(var(--base-dur, 2.8s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    @keyframes doab_pull {
      0%, 100% { transform: translate(0px, 0px); }
      45%, 55% { transform: translate(-20px, -42px); }
    }
    @keyframes doab_elbow {
      0%, 100% { transform: rotate(0deg) scaleY(1); }
      45%, 55% { transform: rotate(36deg) scaleY(0.62); }
    }
    @keyframes doab_pulse {
      0%, 100% { opacity: 0.25; }
      45%, 55% { opacity: 1; }
    }
  </style>

  <rect width="240" height="220" rx="14" fill="#0d1117"/>

  <!-- Sol -->
  <line x1="20" y1="184" x2="220" y2="184" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>

  <!-- Banc plat -->
  <rect x="66" y="136" width="108" height="11" rx="3" fill="#1f2937" stroke="#30363d" stroke-width="1.5"/>
  <line x1="82" y1="147" x2="82" y2="184" stroke="#30363d" stroke-width="4" stroke-linecap="round"/>
  <line x1="158" y1="147" x2="158" y2="184" stroke="#30363d" stroke-width="4" stroke-linecap="round"/>

  <!-- Jambe d'appui arrière au sol -->
  <line x1="86" y1="96" x2="54" y2="144" stroke="#8b949e" stroke-width="5.2" stroke-linecap="round"/>
  <line x1="54" y1="144" x2="48" y2="182" stroke="#8b949e" stroke-width="5" stroke-linecap="round"/>
  <line x1="42" y1="182" x2="54" y2="182" stroke="#8b949e" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Genou et bras gauche en appui ferme sur banc -->
  <polyline points="86,96 96,134 78,134" fill="none" stroke="#8b949e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="142" y1="92" x2="156" y2="134" stroke="#8b949e" stroke-width="4.8" stroke-linecap="round"/>
  <circle cx="156" cy="134" r="3" fill="#e6edf3"/>

  <!-- Rachis horizontal stable -->
  <line x1="86" y1="96" x2="142" y2="92" stroke="#10b981" stroke-width="6.5" stroke-linecap="round"/>
  <circle cx="162" cy="88" r="8" fill="#e6edf3"/>
  <circle cx="86" cy="96" r="3.4" fill="#10b981"/>
  <circle cx="142" cy="92" r="3.2" fill="#10b981"/>

  <!-- Bras droit tirant vers la hanche -->
  <g class="doab_arm">
    <line x1="142" y1="92" x2="134" y2="164" stroke="#e6edf3" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Haltère unilatéral -->
  <g class="doab_db">
    <line x1="120" y1="164" x2="148" y2="164" stroke="#e6edf3" stroke-width="3" stroke-linecap="round"/>
    <rect x="118" y="156" width="6" height="16" rx="1.8" fill="#f59e0b"/>
    <rect x="144" y="156" width="6" height="16" rx="1.8" fill="#f59e0b"/>
  </g>

  <!-- Trajectoire et vecteur poche de hanche -->
  <line x1="134" y1="164" x2="114" y2="122" stroke="#38bdf8" stroke-width="1.3" stroke-dasharray="3 3"/>
  <g class="doab_vec">
    <path d="M188 156 L176 122 M173 130 L175 120 L183 127" fill="none" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="16" y="21" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9" font-weight="600">UPPER · DB ROW</text>
  <text x="224" y="21" text-anchor="end" fill="#10b981" font-family="system-ui,sans-serif" font-size="8.5" font-weight="600">HANCHE STABLE</text>
  <text x="120" y="206" text-anchor="middle" fill="#e6edf3" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600">ROWING HALTÈRE 1 BRAS · APPUI BANC</text>
</svg>
