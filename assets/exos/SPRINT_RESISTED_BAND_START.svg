<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="Départ sprint résisté par élastique : athlète retenu à la taille par un élastique ancré à l'arrière avec tension opposée et poussée avant">
  <style>
    .sprint_band_athlete {
      --base-dur: 1.3s;
      transform-origin: 128px 128px;
      animation: sprint_band_drive calc(var(--base-dur, 1.3s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .sprint_band_elastic {
      --base-dur: 1.3s;
      transform-origin: 28px 128px;
      animation: sprint_band_stretch calc(var(--base-dur, 1.3s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .sprint_band_pull {
      --base-dur: 1.3s;
      animation: sprint_band_resist calc(var(--base-dur, 1.3s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .sprint_band_push {
      --base-dur: 1.3s;
      animation: sprint_band_propel calc(var(--base-dur, 1.3s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .sprint_band_grf {
      --base-dur: 1.3s;
      transform-origin: 84px 186px;
      animation: sprint_band_stamp calc(var(--base-dur, 1.3s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    @keyframes sprint_band_drive {
      0%, 100% { transform: translateX(-5px); }
      55%, 72% { transform: translateX(9px); }
    }
    @keyframes sprint_band_stretch {
      0%, 100% { transform: scaleX(0.95); }
      55%, 72% { transform: scaleX(1.09); }
    }
    @keyframes sprint_band_resist {
      0%, 100% { opacity: 0.45; transform: translateX(4px); }
      55%, 72% { opacity: 1; transform: translateX(-5px); }
    }
    @keyframes sprint_band_propel {
      0%, 100% { opacity: 0.4; transform: translateX(-4px); }
      55%, 72% { opacity: 1; transform: translateX(6px); }
    }
    @keyframes sprint_band_stamp {
      0%, 100% { opacity: 0.85; transform: scaleX(1.1); }
      55%, 72% { opacity: 0.25; transform: scaleX(0.65); }
    }
  </style>

  <rect width="240" height="220" rx="14" fill="#0d1117"/>

  <!-- Sol -->
  <line x1="16" y1="186" x2="224" y2="186" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>

  <!-- Ancrage arrière fixe -->
  <rect x="18" y="102" width="8" height="84" rx="2.5" fill="#1f2937" stroke="#8b949e" stroke-width="1.5"/>
  <rect x="12" y="180" width="20" height="6" rx="2" fill="#30363d"/>
  <circle cx="28" cy="128" r="4" fill="#0d1117" stroke="#38bdf8" stroke-width="2"/>
  <text x="22" y="96" text-anchor="middle" fill="#8b949e" font-family="system-ui,sans-serif" font-size="7.5">ANCRE</text>

  <!-- Élastique de résistance tendu jusqu'à la taille -->
  <g class="sprint_band_elastic">
    <line x1="28" y1="126" x2="128" y2="126" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round"/>
    <line x1="28" y1="130" x2="128" y2="130" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>
  </g>

  <!-- Vecteur de traction opposée ambre / cyan -->
  <g class="sprint_band_pull">
    <line x1="96" y1="112" x2="46" y2="112" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round"/>
    <polyline points="54,107 44,112 54,117" fill="none" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="88" y1="142" x2="54" y2="142" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="5 3" stroke-linecap="round"/>
    <polyline points="60,138 52,142 60,146" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Appui sol -->
  <ellipse class="sprint_band_grf" cx="84" cy="186" rx="13" ry="3" fill="#f59e0b" fill-opacity="0.55"/>

  <!-- Athlète penché contre la résistance élastique -->
  <g class="sprint_band_athlete">
    <!-- Jambe arrière en poussée horizontale forte -->
    <polyline points="76,184 84,183 106,156 128,128" fill="none" stroke="#8b949e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Jambe avant en drive -->
    <polyline points="128,128 156,138 143,170 151,172" fill="none" stroke="#e6edf3" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Tronc très incliné -->
    <line x1="128" y1="128" x2="160" y2="98" stroke="#10b981" stroke-width="7.5" stroke-linecap="round"/>
    <!-- Ceinture d'attache taille -->
    <line x1="124" y1="123" x2="133" y2="133" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
    <!-- Bras en attaque -->
    <polyline points="160,98 136,93 125,107" fill="none" stroke="#8b949e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="160,98 179,108 190,88" fill="none" stroke="#e6edf3" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Tête et articulations -->
    <circle cx="172" cy="86" r="8.2" fill="#e6edf3"/>
    <circle cx="84" cy="183" r="3" fill="#f59e0b"/>
    <circle cx="106" cy="156" r="2.6" fill="#e6edf3"/>
    <circle cx="156" cy="138" r="2.6" fill="#10b981"/>
    <circle cx="128" cy="128" r="3.4" fill="#38bdf8"/>
  </g>

  <!-- Flèche de poussée avant émeraude -->
  <g class="sprint_band_push">
    <line x1="178" y1="132" x2="220" y2="132" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <polyline points="211,126 222,132 211,138" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="16" y="24" fill="#8b949e" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600">SPRINT · BAND START</text>
  <text x="224" y="24" text-anchor="end" fill="#10b981" font-family="system-ui,sans-serif" font-size="9">RÉSISTÉ HORIZONTAL</text>
</svg>
