<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="DB_FARMER_UNI : marche du fermier valise unilatérale rachis vertical">
  <style>
    .leg-l {
      --base-dur: 2.4s;
      transform-origin: 112px 114px;
      animation: DB_FARMER_UNI_legl calc(var(--base-dur, 3.2s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .leg-r {
      --base-dur: 2.4s;
      transform-origin: 128px 114px;
      animation: DB_FARMER_UNI_legr calc(var(--base-dur, 3.2s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .plumb {
      --base-dur: 2.4s;
      animation: DB_FARMER_UNI_plumb calc(var(--base-dur, 3.2s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    @keyframes DB_FARMER_UNI_legl {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes DB_FARMER_UNI_legr {
      0%, 100% { transform: translateY(-6px); }
      50% { transform: translateY(0px); }
    }
    @keyframes DB_FARMER_UNI_plumb {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
  </style>

  <rect width="240" height="220" rx="14" fill="#0d1117"/>
  <line x1="20" y1="184" x2="220" y2="184" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

  <!-- Axe vertical anti-inclinaison latérale (vue frontale) -->
  <g class="plumb">
    <line x1="120" y1="24" x2="120" y2="178" stroke="#10b981" stroke-width="1.4" stroke-dasharray="4 3"/>
  </g>

  <!-- Jambes vue de face (marche sur place contrôlée) -->
  <g class="leg-l">
    <line x1="112" y1="114" x2="112" y2="148" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
    <line x1="112" y1="148" x2="112" y2="180" stroke="#94a3b8" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="112" cy="148" r="3" fill="#f8fafc"/>
  </g>
  <g class="leg-r">
    <line x1="128" y1="114" x2="128" y2="148" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
    <line x1="128" y1="148" x2="128" y2="180" stroke="#94a3b8" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="128" cy="148" r="3" fill="#f8fafc"/>
  </g>

  <!-- Bassin et Ceinture scapulaire horizontaux -->
  <line x1="108" y1="114" x2="132" y2="114" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
  <line x1="102" y1="64" x2="138" y2="64" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round"/>

  <!-- Rachis strictement vertical vert -->
  <line x1="120" y1="114" x2="120" y2="64" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
  <circle cx="120" cy="44" r="8.5" fill="#cbd5e1"/>

  <!-- Bras gauche libre (équilibre) -->
  <line x1="102" y1="64" x2="94" y2="116" stroke="#e2e8f0" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Bras droit portant valise unilatérale 10 kg -->
  <line x1="138" y1="64" x2="144" y2="122" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
  <rect x="135" y="122" width="18" height="12" rx="3" fill="#64748b" stroke="#e2e8f0" stroke-width="1.3"/>
  <text x="144" y="131" text-anchor="middle" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="6.5" font-weight="700">10</text>

  <circle cx="102" cy="64" r="2.8" fill="#22d3ee"/>
  <circle cx="138" cy="64" r="2.8" fill="#22d3ee"/>
  <circle cx="120" cy="114" r="3" fill="#22d3ee"/>

  <text x="120" y="203" text-anchor="middle" fill="#10b981" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600">ANTI-FLEXION LATÉRALE · 10 KG</text>
  <text x="16" y="24" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600">DB · FARMER UNI</text>
  <text x="224" y="24" text-anchor="end" fill="#10b981" font-family="system-ui,sans-serif" font-size="9">AXE 0°</text>
</svg>
