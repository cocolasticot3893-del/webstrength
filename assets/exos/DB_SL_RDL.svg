<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="DB_SL_RDL : soulevé de terre roumain unilatéral haltères tempo 3-1-1">
  <style>
    .hip-t {
      --base-dur: 4.2s;
      transform-origin: 118px 104px;
      animation: DB_SL_RDL_tilt calc(var(--base-dur, 3.2s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .arm-hang {
      --base-dur: 4.2s;
      transform-origin: 118px 60px;
      animation: DB_SL_RDL_arm calc(var(--base-dur, 3.2s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    .tempo-dot {
      --base-dur: 4.2s;
      animation: DB_SL_RDL_tempo calc(var(--base-dur, 3.2s) / var(--anim-speed, 1)) ease-in-out infinite;
      animation-play-state: var(--anim-state, running);
    }
    @keyframes DB_SL_RDL_tilt {
      0%, 100% { transform: rotate(4deg); }
      52%, 68% { transform: rotate(84deg); }
    }
    @keyframes DB_SL_RDL_arm {
      0%, 100% { transform: rotate(-4deg); }
      52%, 68% { transform: rotate(-84deg); }
    }
    @keyframes DB_SL_RDL_tempo {
      0%, 15% { fill: #f59e0b; opacity: 0.4; }
      35%, 68% { fill: #ef4444; opacity: 1; }
      82%, 100% { fill: #10b981; opacity: 0.85; }
    }
  </style>

  <rect width="240" height="220" rx="14" fill="#0d1117"/>
  <line x1="20" y1="184" x2="220" y2="184" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>

  <!-- Jambe d'appui fixe -->
  <path d="M114 182 L134 182" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <line x1="118" y1="182" x2="120" y2="144" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="120" y1="144" x2="118" y2="104" stroke="#cbd5e1" stroke-width="6.5" stroke-linecap="round"/>
  <circle cx="118" cy="182" r="2.8" fill="#22d3ee"/>
  <circle cx="120" cy="144" r="3.2" fill="#f8fafc"/>

  <!-- Bascule en T : jambe arrière alignée avec rachis vert -->
  <g class="hip-t">
    <!-- Jambe arrière tendue -->
    <line x1="118" y1="104" x2="118" y2="178" stroke="#64748b" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="118" cy="142" r="2.6" fill="#94a3b8"/>
    <!-- Dos plat vert neutre aligné -->
    <line x1="118" y1="104" x2="118" y2="60" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <circle cx="118" cy="44" r="8.5" fill="#cbd5e1"/>
    <!-- Bras + haltère compact -->
    <g class="arm-hang">
      <line x1="118" y1="60" x2="122" y2="110" stroke="#e2e8f0" stroke-width="4.8" stroke-linecap="round"/>
      <rect x="113" y="108" width="18" height="7" rx="2" fill="#64748b" stroke="#e2e8f0" stroke-width="1.2"/>
      <rect x="115" y="106" width="4" height="11" rx="1" fill="#e2e8f0"/>
      <rect x="125" y="106" width="4" height="11" rx="1" fill="#e2e8f0"/>
    </g>
    <circle cx="118" cy="60" r="3" fill="#22d3ee"/>
  </g>
  <circle cx="118" cy="104" r="3.5" fill="#22d3ee"/>

  <!-- Repère Tempo 3-1-1 -->
  <circle class="tempo-dot" cx="28" cy="199" r="4" fill="#f59e0b"/>
  <text x="38" y="203" fill="#f59e0b" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600">TEMPO 3-1-1 · EN T</text>
  <text x="16" y="24" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="9.5" font-weight="600">DB · SL RDL</text>
  <text x="224" y="24" text-anchor="end" fill="#10b981" font-family="system-ui,sans-serif" font-size="9">ALIGNEMENT T</text>
</svg>
